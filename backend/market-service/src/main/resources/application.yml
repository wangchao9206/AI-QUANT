server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: market-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiquant}
    username: ${DATABASE_USERNAME:aiquant}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:4}
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1500000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: ${DATABASE_SCHEMA:public}
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 800ms
      connect-timeout: 800ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    stream:
      bindings:
        marketQuote-out-0:
          destination: market_quote_updated
      rocketmq:
        binder:
          name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}

aiquant:
  market-data:
    base-url: ${ALGORITHM_SERVICE_URL:http://localhost:8000}
    connect-timeout: 1s
    read-timeout: 6s
  ingestion:
    base-url: ${ALGORITHM_SERVICE_URL:http://localhost:8000}
    symbols: ${MARKET_SYMBOLS:CJ2612,CJ2701,CJ2703,CJ2705}
    interval-ms: ${MARKET_INGESTION_INTERVAL_MS:15000}
    read-timeout: ${MARKET_INGESTION_READ_TIMEOUT:6s}
  cache:
    quote-ttl: 20s
    ttl-jitter-seconds: 10
  messaging:
    enabled: ${ROCKETMQ_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
