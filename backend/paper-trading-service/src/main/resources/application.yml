server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: paper-trading-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aiquant}
    username: ${DATABASE_USERNAME:aiquant}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:4}
      connection-timeout: 2000
      validation-timeout: 1000
      idle-timeout: 300000
      max-lifetime: 1500000
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  flyway:
    enabled: true

aiquant:
  algorithm-base-url: ${ALGORITHM_SERVICE_URL:http://localhost:8000}
  market-base-url: ${MARKET_SERVICE_URL:http://localhost:8081}
  client:
    connect-timeout: 2s
    read-timeout: 180s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
