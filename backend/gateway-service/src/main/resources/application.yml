server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      eager: true
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 180s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
                allowed-methods: [GET, POST, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, X-Trace-Id]
                exposed-headers: [X-Trace-Id]
          routes:
            - id: market-service
              uri: ${MARKET_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/market/**
            - id: strategy-service
              uri: ${STRATEGY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/predictions/**,/api/v1/strategies/**
            - id: paper-trading-service
              uri: ${PAPER_TRADING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/paper/**
            - id: algorithm-service
              uri: ${ALGORITHM_SERVICE_URL:http://localhost:8000}
              predicates:
                - Path=/api/v1/backtest/**,/api/v1/data/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
