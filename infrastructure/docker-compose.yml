name: ai-quant

x-java-common: &java-common
  restart: unless-stopped
  networks: [application, data]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m", "/app/logs:rw,noexec,nosuid,size=32m"]
  environment: &java-environment
    JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/tmp -Duser.home=/tmp -Dcsp.sentinel.log.dir=/tmp/sentinel -Drocketmq.client.logRoot=/tmp/rocketmqlogs -Dfile.encoding=UTF-8
    DATABASE_URL: jdbc:postgresql://pgbouncer:5432/${POSTGRES_DB:-aiquant}
    DATABASE_USERNAME: ${POSTGRES_USER:-aiquant}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
    REDIS_HOST: redis
    NACOS_ENABLED: ${NACOS_ENABLED:-false}
    NACOS_SERVER_ADDR: nacos:8848
    NACOS_USERNAME: ${NACOS_USERNAME}
    NACOS_PASSWORD: ${NACOS_PASSWORD}
    ROCKETMQ_ENABLED: "true"
    ROCKETMQ_NAME_SERVER: rocketmq-namesrv:9876
  deploy:
    resources:
      limits: { cpus: "1.00", memory: 768M }
      reservations: { memory: 256M }

services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiquant}
      POSTGRES_USER: ${POSTGRES_USER:-aiquant}
      # Development-only fallback. Production deployments must override it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    restart: unless-stopped
    networks: [data]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-aiquant}
      DB_USER: ${POSTGRES_USER:-aiquant}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 60
      RESERVE_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -p 5432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    networks: [data]
    command: [redis-server, --appendonly, "yes", --maxmemory, 512mb, --maxmemory-policy, allkeys-lru]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 640M }

  nacos:
    image: nacos/nacos-server:v2.4.3
    restart: unless-stopped
    networks: [application]
    ports: ["127.0.0.1:${NACOS_PORT:-8848}:8848"]
    volumes: [nacos-data:/home/nacos/data]
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      # Local Docker defaults to disabled auth because discovery is isolated on the
      # internal application network. Production can enable it and must provide all
      # three Nacos credentials explicitly.
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:8848/nacos/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  rocketmq-volume-init:
    image: apache/rocketmq:5.3.1
    user: "0:0"
    network_mode: none
    entrypoint: [sh, -c]
    command: ["chown 3000:3000 /namesrv-logs /broker-logs /store"]
    volumes:
      - rocketmq-namesrv-logs:/namesrv-logs
      - rocketmq-broker-logs:/broker-logs
      - rocketmq-store:/store
    security_opt: [no-new-privileges:true]

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    networks: [application]
    command: sh mqnamesrv
    environment:
      HEAP_OPTS: -Xms128m -Xmx256m -Xmn128m
    depends_on:
      rocketmq-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes: [rocketmq-namesrv-logs:/home/rocketmq/logs]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    networks: [application]
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    environment:
      HEAP_OPTS: -Xms256m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=128m
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-store:/home/rocketmq/store
    depends_on:
      rocketmq-volume-init: { condition: service_completed_successfully }
      rocketmq-namesrv: { condition: service_healthy }
    healthcheck:
      test: [CMD, bash, -c, "echo > /dev/tcp/127.0.0.1/10911"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }

  rocketmq-topic-init:
    image: apache/rocketmq:5.3.1
    networks: [application]
    entrypoint: [sh, -c]
    command:
      - "for attempt in 1 2 3 4 5; do if sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c aiquant-cluster -t market_quote_updated && sh mqadmin updateTopic -n rocketmq-namesrv:9876 -c aiquant-cluster -t strategy_prediction_updated; then exit 0; fi; sleep 2; done; exit 1"
    depends_on:
      rocketmq-namesrv: { condition: service_healthy }
      rocketmq-broker: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  algorithm-service:
    build:
      context: ..
      dockerfile: algorithm_service/Dockerfile
    restart: unless-stopped
    networks: [application]
    environment:
      ENABLE_API_DOCS: "false"
      CORS_ORIGINS: http://frontend:8080
      MARKET_DATA_TIMEOUT: 3
      MARKET_SYMBOLS: IFM,RBM,MM,CJM,SIM,TM
      MARKET_REFRESH_SECONDS: 30
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-tqsdk}
      TQSDK_USERNAME: ${TQSDK_USERNAME:-}
      TQSDK_PASSWORD: ${TQSDK_PASSWORD:-}
      TQSDK_FRESHNESS_SECONDS: ${TQSDK_FRESHNESS_SECONDS:-15}
      TQSDK_BACKTEST_BARS: ${TQSDK_BACKTEST_BARS:-2000}
      TQSDK_BACKTEST_CACHE_TTL_SECONDS: ${TQSDK_BACKTEST_CACHE_TTL_SECONDS:-43200}
      HISTORY_CACHE_DIR: /var/lib/aiquant/history
      RESEARCH_PUBLISHED_ROOT: /var/lib/aiquant/research-published
      RESEARCH_OBSERVATION_PATH: /var/lib/aiquant/fu-observation/shadow-state.json
      BACKTEST_MAX_CONCURRENCY: ${BACKTEST_MAX_CONCURRENCY:-1}
      LEADS_SCAN_WORKERS: ${LEADS_SCAN_WORKERS:-4}
      LEADS_CACHE_TTL_SECONDS: ${LEADS_CACHE_TTL_SECONDS:-60}
    volumes:
      - ../docs/research/published:/var/lib/aiquant/research-published:ro
      - ../docs/research/data/fu-regime-2026-10-27:/var/lib/aiquant/fu-observation:ro
      - market-feed-data:/var/lib/aiquant/feed
      - ../data/history:/var/lib/aiquant/history:rw
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 4s
      retries: 8
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 1G }

  market-service:
    <<: *java-common
    build: { context: ../backend, dockerfile: market-service/Dockerfile }
    environment:
      <<: *java-environment
      SERVER_PORT: 8081
      ALGORITHM_SERVICE_URL: http://algorithm-service:8000
      DATABASE_POOL_SIZE: 30
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiquant}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-aiquant}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
      SPRING_FLYWAY_SCHEMAS: market
      DATABASE_SCHEMA: market
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rocketmq-namesrv: { condition: service_started }
      algorithm-service: { condition: service_healthy }
      rocketmq-topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8081/actuator/health/readiness]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 40s

  strategy-service:
    <<: *java-common
    build: { context: ../backend, dockerfile: strategy-service/Dockerfile }
    environment:
      <<: *java-environment
      SERVER_PORT: 8082
      DATABASE_POOL_SIZE: 30
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiquant}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-aiquant}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
      SPRING_FLYWAY_SCHEMAS: strategy
      DATABASE_SCHEMA: strategy
      ALGORITHM_SERVICE_URL: http://algorithm-service:8000
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration,org.springframework.cloud.stream.binder.rocketmq.autoconfigurate.RocketMQTransactionConfiguration
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }
      rocketmq-namesrv: { condition: service_started }
      algorithm-service: { condition: service_healthy }
      rocketmq-topic-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8082/actuator/health/readiness]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 40s

  paper-trading-service:
    <<: *java-common
    build: { context: ../backend, dockerfile: paper-trading-service/Dockerfile }
    environment:
      <<: *java-environment
      SERVER_PORT: 8083
      DATABASE_POOL_SIZE: 40
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiquant}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-aiquant}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-local-only-aiquant-change-me}
      SPRING_FLYWAY_SCHEMAS: paper_trading
      DATABASE_SCHEMA: paper_trading
      ALGORITHM_SERVICE_URL: http://algorithm-service:8000
      MARKET_SERVICE_URL: http://market-service:8081
    depends_on:
      pgbouncer: { condition: service_healthy }
      nacos: { condition: service_healthy }
      algorithm-service: { condition: service_healthy }
      market-service: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8083/actuator/health/readiness]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 40s

  gateway-service:
    <<: *java-common
    build: { context: ../backend, dockerfile: gateway-service/Dockerfile }
    ports: ["127.0.0.1:${GATEWAY_PORT:-18080}:8080"]
    environment:
      <<: *java-environment
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MARKET_SERVICE_URL: http://market-service:8081
      STRATEGY_SERVICE_URL: http://strategy-service:8082
      PAPER_TRADING_SERVICE_URL: http://paper-trading-service:8083
      ALGORITHM_SERVICE_URL: http://algorithm-service:8000
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-8088},http://127.0.0.1:${FRONTEND_PORT:-8088}"
    depends_on:
      market-service: { condition: service_healthy }
      strategy-service: { condition: service_healthy }
      paper-trading-service: { condition: service_healthy }
      algorithm-service: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 15s
      timeout: 4s
      retries: 10
      start_period: 30s

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped
    networks: [application]
    ports: ["${FRONTEND_PORT:-8088}:8080"]
    depends_on:
      gateway-service: { condition: service_healthy, restart: true }
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/var/cache/nginx:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 4s
      retries: 8
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [application]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

networks:
  application: { driver: bridge }
  data: { driver: bridge, internal: true }

volumes:
  market-feed-data:
  postgres-data:
  redis-data:
  nacos-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-store:
  prometheus-data:
