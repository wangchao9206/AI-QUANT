global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-service:8080]
  - job_name: market-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [market-service:8081]
  - job_name: strategy-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [strategy-service:8082]
  - job_name: paper-trading-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [paper-trading-service:8083]
